<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Tic-Tac-Toe with Solo (Easy, Medium, Hard AI) and Duo modes.">
<title>Tic-Tac-Toe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230d0b1f'/%3E%3Cpath d='M22 22l30 30M52 22L22 52' stroke='%2300e5ff' stroke-width='9' stroke-linecap='round'/%3E%3Ccircle cx='68' cy='68' r='16' fill='none' stroke='%23ff3df2' stroke-width='9'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="icon-btn" id="themeBtn" aria-label="Switch to light theme">☀️</button>
    <button class="icon-btn" id="soundBtn" aria-label="Mute sound" aria-pressed="false">🔊</button>
  </div>

  <!-- HOME -->
  <section id="home" class="screen">
    <div class="logo" aria-hidden="true"><span class="gx">✕</span><span class="go">○</span><span class="gx">✕</span></div>
    <h1>Tic-Tac-Toe</h1>
    <p class="lead">Three in a row wins. Play the computer or a friend on the same device.</p>
    <div class="stack">
      <button class="btn primary big" id="soloBtn">Play Solo</button>
      <button class="btn primary big alt" id="duoBtn">Play Duo</button>
      <button class="btn" id="statsBtn">View Statistics</button>
      <button class="btn" id="howBtn">How to Play</button>
    </div>
  </section>

  <!-- SOLO SETUP -->
  <section id="soloSetup" class="screen" hidden>
    <h1 class="sm">Solo</h1>
    <p class="lead">You play <b class="x">X</b> and move first. The computer plays <b class="o">O</b>.</p>
    <h2 class="label">AI difficulty</h2>
    <div class="choices" id="diffChoices" role="radiogroup" aria-label="AI difficulty"></div>
    <div class="stack">
      <button class="btn primary big" id="soloStart">Start Game</button>
      <button class="btn" data-home>Back</button>
    </div>
  </section>

  <!-- DUO SETUP -->
  <section id="duoSetup" class="screen" hidden>
    <h1 class="sm">Duo</h1>
    <p class="lead">Two players, one device. Player 1 is <b class="x">X</b> and moves first.</p>
    <div class="fields">
      <label>Player 1 name (<b class="x">X</b>)<input id="p1Name" maxlength="12" autocomplete="off" placeholder="Player 1"></label>
      <label>Player 2 name (<b class="o">O</b>)<input id="p2Name" maxlength="12" autocomplete="off" placeholder="Player 2"></label>
    </div>
    <div class="stack">
      <button class="btn primary big" id="duoStart">Start Game</button>
      <button class="btn" data-home>Back</button>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen" hidden>
    <div class="players">
      <div class="pl" id="plX"><span class="x sym">X</span><span id="nameX"></span></div>
      <div class="vs">vs</div>
      <div class="pl" id="plO"><span class="o sym">O</span><span id="nameO"></span></div>
    </div>
    <p class="turn" id="turn" aria-live="polite"></p>
    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Tic-Tac-Toe board"></div>
      <svg class="win-line" id="winLine" viewBox="0 0 3 3" preserveAspectRatio="none" aria-hidden="true"><line id="winLineEl" x1="0" y1="0" x2="0" y2="0"/></svg>
    </div>
    <div class="score" id="score"></div>
    <div class="controls">
      <button class="btn" id="restartBtn">Restart</button>
      <button class="btn" id="homeBtn">Home</button>
    </div>
  </section>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
    <div class="modal-actions" id="mActions"></div>
  </div>
</div>
<script src="js/logic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
